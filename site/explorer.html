<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earthacta — Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="CSS/style.css" type="text/css" rel="stylesheet">
<link href="CSS/toggle.css" type="text/css" rel="stylesheet">
<style>
  .map-pins{
    position:absolute; inset:0; z-index:3;
    pointer-events:none;
  }
  .pin{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center;
    cursor:pointer;
    pointer-events:auto;
  }

  /* Size encodes HIERARCHY level. Color encodes DATA STATUS
     (worst provenance state across the node's categories) —
     same verified/pending/flagged/missing palette as the badges,
     so map color and panel badges mean the same thing everywhere. */
  .pin[data-level="country"] .pin-dot{ width:16px; height:16px; }
  .pin[data-level="region"] .pin-dot{ width:11px; height:11px; }
  .pin[data-level="district"] .pin-dot{ width:7px; height:7px; }

  .pin-dot{
    border-radius:50%;
    border:2px solid var(--mint);
  }
  .pin-dot.status-verified{ background:var(--verified); }
  .pin-dot.status-pending{ background:var(--pending); }
  .pin-dot.status-flagged{ background:var(--flagged); }
  .pin-dot.status-missing{ background:var(--missing); }

  /* Selected node gets the "hotspot" ring treatment — reserved for
     the CURRENT selection, not applied to every country by default */
  .pin.active .pin-ring{
    position:absolute; left:50%; top:50%;
    width:26px; height:26px;
    border-radius:50%;
    border:1.5px solid var(--mint);
    transform:translate(-50%,-50%);
  }
  .pin.active .pin-ring::after{
    content:"";
    position:absolute; left:50%; top:50%;
    width:5px; height:5px; border-radius:50%;
    background:var(--mint);
    transform:translate(-50%,-50%);
  }

  .pin[data-level="country"] .pin-label{
    font-size:12px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase;
    margin-top:6px; color:var(--mint); text-shadow:0 1px 3px rgba(0,0,0,0.7);
  }
  .pin[data-level="region"] .pin-label{
    font-size:11px; font-weight:600; margin-top:5px;
    color:var(--text-dim); text-shadow:0 1px 3px rgba(0,0,0,0.7);
  }
  .pin[data-level="district"] .pin-label{
    font-size:10px; font-weight:400; margin-top:4px;
    color:var(--text-faint); text-shadow:0 1px 3px rgba(0,0,0,0.7);
  }
  .pin.active .pin-label{ color:var(--mint) !important; }

  .map-legend{
    position:absolute; bottom:16px; right:20px; z-index:5;
    background:rgba(9,35,40,0.88);
    border:1px solid var(--border);
    border-radius:var(--r-md);
    padding:8px 12px;
    display:flex; gap:12px;
    font-size:10.5px;
    color:var(--text-dim);
  }
  .map-legend .lg-item{ display:flex; align-items:center; gap:5px; }
  .map-legend .lg-dot{ width:8px; height:8px; border-radius:50%; }

  .bg-placeholder-note{
    position:absolute; bottom:16px; left:20px; z-index:4;
    font-size:11px; color:rgba(229,237,230,0.35);
  }
  .no-coverage{
    padding:24px 10px; text-align:center; color:var(--text-faint); font-size:13px;
  }
  .facts-mini{ list-style:none; margin:0; padding:0; }
  .facts-mini li{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    font-size:13px; padding:6px 0; border-bottom:1px solid rgba(229,237,230,0.06);
  }
</style>
</head>
<body>
<div class="mainBg">

  <div class="stage stage_water_bg" id="stage">

    <div class="river-layer"></div>

    <div class="hint-pill">
      <span>&#8596; &#8597;</span> Drag to explore · click a tile to drill in
    </div>

    <div class="logo-card">
      <div class="logo-text"><img src="assets/EarthActa_logo.svg"></div>
    </div>

    <div class="map-pins" id="mapPins"></div>

    <div class="map-legend">
      <div class="lg-item"><span class="lg-dot" style="background:var(--verified);"></span>verified</div>
      <div class="lg-item"><span class="lg-dot" style="background:var(--pending);"></span>pending</div>
      <div class="lg-item"><span class="lg-dot" style="background:var(--flagged);"></span>flagged</div>
      <div class="lg-item"><span class="lg-dot" style="background:var(--missing);"></span>no data</div>
    </div>

    <div class="bg-placeholder-note" id="bgNote"></div>

    <div class="rail" id="categoryRail">
      <div class="rail-item active" data-category="water">
        <img src="assets/icons/water-outline.svg"> WATER
      </div>
      <div class="rail-item" data-category="land">
        <img src="assets/icons/mdi_land-fields.svg"> LAND
      </div>
      <div class="rail-item" data-category="forest">
        <img src="assets/icons/forest-outline.svg"> FOREST
      </div>
      <div class="rail-item" data-category="minerals">
        <img src="assets/icons/lineicons_diamonds-1.svg"> MINERALS
      </div>
      <div class="rail-item" data-category="energy">
        <img src="assets/icons/power.svg"> ENERGY
      </div>
    </div>

    <div class="info-panel" id="infoPanel">
      <div class="info-panel-head">
        <h2 id="panelTitle">India — Water</h2>
        <button class="toggle-btn" id="toggleBtn" type="button" aria-expanded="true" aria-label="Collapse panel">
          <span class="icon-minus"><img src="assets/icons/minus-circle.svg"></span>
        </button>
      </div>
      <div class="info-panel-body" id="infoPanelBody"></div>
    </div>

    <div class="data-panel">
      <div class="data-title-row">
        <div class="data-title" id="dataTitle">INDIA — WATER</div>
      </div>
      <div class="columns" id="dataColumns"></div>
    </div>

  </div>
</div>

<script src="script/data.js"></script>
<script>

let currentNode = "IN";
let currentCategory = "water";

function badge(status){
  return `<span class="prov-badge ${status}"><span class="dot"></span>${status}</span>`;
}

function renderIndiaWater(){
  document.getElementById('infoPanelBody').innerHTML = `
    <div class="big-stat">14</div>
    <div class="prov-row">${badge('verified')}<span class="mono-cite">Central Water Commission · 2025</span></div>
    <div class="info-desc">Major river basins recognized nationally, covering roughly 83% of India's total drainage area.</div>
  `;
  document.getElementById('dataColumns').innerHTML = `
    <div class="col">
      <div class="col-head"><h3>Total renewable water resources</h3></div>
      <div class="stat-value" style="font-size:20px; font-weight:700; margin-bottom:6px;">1,999 BCM/yr</div>
      <div class="prov-row">${badge('verified')}<span class="mono-cite">CWC National Water Resources · 2024</span></div>
    </div>
    <div class="col">
      <div class="col-head"><h3>Per-capita water availability</h3></div>
      <div class="stat-value" style="font-size:20px; font-weight:700; margin-bottom:6px;">1,486 m³/yr</div>
      <div class="prov-row">${badge('pending')}<span class="mono-cite">projection, not a direct measurement · 2024</span></div>
    </div>
    <div class="col">
      <div class="col-head"><h3>States/regions in this hierarchy</h3></div>
      <ul class="facts-mini"><li><span>Odisha</span><span class="mono-cite">select above to drill in</span></li></ul>
    </div>
  `;
}

function renderIndiaLand(){
  document.getElementById('infoPanelBody').innerHTML = `
    <div class="big-stat">3.28 <span style="font-size:16px;">million sq km</span></div>
    <div class="prov-row">${badge('verified')}<span class="mono-cite">World Bank · 2024</span></div>
    <div class="info-desc">India spans 3.28 million km², about 2.4% of the world's land area.</div>
  `;
  document.getElementById('dataColumns').innerHTML = `
    <div class="col">
      <div class="col-head"><h3>Climate</h3></div>
      <p style="font-size:12.5px; color:var(--text-dim); line-height:1.5;">Strongly influenced by the Himalayas and the Thar Desert, which drive the summer and winter monsoons. The Himalayas block cold Central Asian winds, keeping the subcontinent warmer than most locations at similar latitude.</p>
      <div class="prov-row">${badge('missing')}<span class="mono-cite">no source cited</span></div>
    </div>
    <div class="col">
      <div class="col-head"><h3>Biodiversity</h3></div>
      <p style="font-size:12.5px; color:var(--text-dim); line-height:1.5;">India is a megadiverse country, home to 8.6% of all mammal species, 13.7% of bird species, 7.9% of reptile species, and 12.2% of fish species globally.</p>
      <div class="prov-row">${badge('flagged')}<span class="mono-cite">footnote [190] copied without its source</span></div>
    </div>
    <div class="col">
      <div class="col-head"><h3>States/regions in this hierarchy</h3></div>
      <ul class="facts-mini"><li><span>Odisha</span><span class="mono-cite">select above to drill in</span></li></ul>
    </div>
  `;
}

function renderMatrix(cat){
  document.getElementById('infoPanelBody').innerHTML = `
    <div class="big-stat">${cat.headline.value}</div>
    <div class="prov-row">${badge(cat.headline.status)}<span class="mono-cite">${cat.headline.cite}</span></div>
    <div class="info-desc">${cat.headline.label}</div>
  `;
  document.getElementById('dataColumns').innerHTML = cat.stats.map(s => `
    <div class="col">
      <div class="col-head"><h3>${s.label}</h3></div>
      <div class="stat-value" style="font-size:20px; font-weight:700; margin-bottom:6px;">${s.value}</div>
      <div class="prov-row">${badge(s.status)}<span class="mono-cite">${s.cite}</span></div>
    </div>
  `).join('');
}

function renderNone(){
  document.getElementById('infoPanelBody').innerHTML = `<div class="no-coverage">No country-level data built yet for this category. Select a region below for available data.</div>`;
  document.getElementById('dataColumns').innerHTML = '';
}

function renderPanel(){
  const node = NODES[currentNode];
  const cat = node[currentCategory];
  const catLabel = currentCategory.charAt(0).toUpperCase() + currentCategory.slice(1);

  document.getElementById('panelTitle').textContent = `${node.name} — ${catLabel}`;
  document.getElementById('dataTitle').textContent = `${node.name.toUpperCase()} — ${catLabel.toUpperCase()}`;

  if(cat.kind === 'india_water') renderIndiaWater();
  else if(cat.kind === 'india_land') renderIndiaLand();
  else if(cat.kind === 'matrix') renderMatrix(cat);
  else renderNone();
}

document.getElementById('mapPins').addEventListener('click', (e) => {
  const pin = e.target.closest('.pin');
  if(!pin) return;
  currentNode = pin.dataset.node;
  buildPins();
  renderPanel();
});

const CATEGORY_BG = {
  water: 'stage_water_bg',
  land: 'stage_land_bg',
  forest: 'stage_forest_bg',
  minerals: 'stage_minerals_bg',
  energy: 'stage_energy_bg'
};
const CATEGORY_BG_READY = { water:true, land:true, forest:false, minerals:false, energy:false };

function updateStageBackground(){
  const stage = document.getElementById('stage');
  Object.values(CATEGORY_BG).forEach(cls => stage.classList.remove(cls));
  stage.classList.add(CATEGORY_BG[currentCategory]);
  document.getElementById('bgNote').textContent = CATEGORY_BG_READY[currentCategory]
    ? ''
    : 'placeholder background — needs real map art for this category';
}

document.getElementById('categoryRail').addEventListener('click', (e) => {
  const item = e.target.closest('.rail-item');
  if(!item) return;
  currentCategory = item.dataset.category;
  document.querySelectorAll('.rail-item').forEach(p => p.classList.toggle('active', p === item));
  updateStageBackground();
  renderPanel();
});

const SEVERITY = { flagged:3, missing:2, pending:1, verified:0 };

function nodeWorstStatus(node){
  const categories = ['water','land','forest','minerals','energy'];
  let worst = 'verified';
  categories.forEach(c => {
    const cat = node[c];
    if(!cat) return;
    let s;
    if(cat.kind === 'matrix') s = cat.headline.status;
    else if(cat.kind === 'none') s = 'missing';
    else if(cat.kind === 'india_water') s = 'verified';
    else if(cat.kind === 'india_land') s = 'flagged';
    else s = 'verified';
    if(SEVERITY[s] > SEVERITY[worst]) worst = s;
  });
  return worst;
}

function buildPins(){
  const container = document.getElementById('mapPins');
  container.innerHTML = Object.keys(NODES).map(id => {
    const n = NODES[id];
    const activeClass = id === currentNode ? ' active' : '';
    const status = nodeWorstStatus(n);
    const ring = id === currentNode ? '<div class="pin-ring"></div>' : '';
    return `<div class="pin${activeClass}" data-node="${id}" data-level="${n.level}" style="left:${n.coords.x}%; top:${n.coords.y}%;">
      ${ring}
      <div class="pin-dot status-${status}"></div>
      <div class="pin-label">${n.name}</div>
    </div>`;
  }).join('');
}

buildPins();
updateStageBackground();
renderPanel();
</script>

<script src="script/toggle.js"></script>
</body>
</html>
